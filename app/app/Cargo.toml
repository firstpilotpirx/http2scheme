[workspace]
members = ["apps/*", "components/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
linkserver = { path = "components/linkserver" }
menubar = { path = "components/menubar" }
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
config = { version = "=0.15.27", default-features = false, features = ["toml"] }
cucumber = { version = "=0.23.0", features = ["output-junit"] }
env_logger = { version = "=0.11.11", default-features = false }
getrandom = "=0.4.3"
log = "=0.4.35"
mockall = "=0.15.0"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBox", "NSButton", "NSCell", "NSClipView", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSScrollView", "NSSegmentedControl", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSSwitch", "NSTabView", "NSTabViewItem", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSDate", "NSError", "NSGeometry", "NSObject", "NSString", "NSTimeZone"] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
owo-colors = { version = "=4.4.0", features = ["supports-colors"] }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "sync"] }
ureq = { version = "=3.5.2", default-features = false }
wiremock = "=0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
redundant_clone = "deny"
use_self = "deny"
or_fun_call = "deny"
needless_collect = "deny"
significant_drop_in_scrutinee = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
allow_attributes_without_reason = "deny"
